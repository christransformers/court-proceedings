	function printNotice() {
		var iframe = window.frames["noticeDialogIframe"];
		if ( iframe.contentWindow != null){
			iframe.contentWindow.print();
		}
		else {
			iframe.print();                		
		}
	}
	
	
	var parent_url = "";
	
    function logDebug(debug) {
    	if ( window.console != null ) {
    		console.log(debug);
    	}
    }  
	// Post size change message to host page
	postMessageFn = function(msg) {
	    		$.postMessage(msg, parent_url);
	};

	
	$(function(){ 
	     // Hook up the receive message event	    
	     	     
    	$.receiveMessage(function(e) {
	
			parent_url = e.data.match(/parentUrl=(.+)/);
			if (parent_url) {
				parent_url = parent_url[1];
			}
	
			if (parent_url != null && parent_url !== "") {
				var lastHeight = $('body').height();
		
		    	logDebug("Post Msg - 'formHeight='" + lastHeight + "'px'");		
				postMessageFn('formHeight=' + lastHeight + 'px');
				// Unbind message listener
				$.receiveMessage();
				
						
			}   
    	});
    	
        // jQuery UI Dialog
        $('#dialog-modal').dialog({
            autoOpen: false,
            minWidth: 400,            
            width: 700,
            minHeight: 200,
            modal: true,
            resizable: false     	
        });                 
	});	    	


	
    function prepareDialog(number) {
    	
        $('#noticeDialogIframe').attr('src', "/probate/notice?noticeID=" + number ) ;
		$('#hrefPrint').attr('href', '/probate/noticePdf?noticeID=' + number )

    }
    
    function autoResize(iframe, id){
        var newheight;
        
        if ( !iframe )  {
	        if(document.getElementById){
	        	iframe = document.getElementById(id) ;
	        }  	
        }
                
        if ( iframe ) { 
        	if ( iframe.src ) {
            	var divControl = iframe.contentWindow.document.body.firstChild ;
            	
            	if ( divControl ) {
                	newheight=divControl.scrollHeight;
            	}
            	
            	iframe.height = (newheight + 30) + "px";         		
        	}
        }
        
        //document.getElementById('dialog-modal').height = (newheight + 100) + "px";
    }

<script  type="text/javascript">
String.prototype.lpad = function(padString, length) {
	var str = this;
    while (str.length < length)
        str = padString + str;
    return str;
}

function formatCaseNumber() {
	var caseYearField = $("#searchForm_caseYear") ;
	var caseNumberField = $("#searchForm_caseNumber") ;	
	
	if ( caseYearField ) {
		var caseNumber = caseYearField.val() ;
		if ( caseNumber ) {
			caseNumber = caseNumber.lpad('0', 3) ;
			if ( caseNumber.length < 4) {
				caseNumber = '2' + caseNumber ;
			}
			caseYearField.val(caseNumber) ;
		}
	}
	
	if ( caseNumberField ) {
		var caseNumber = caseNumberField.val() ;
		if ( caseNumber ) {
			caseNumber = caseNumber.lpad('0', 8) ;
			caseNumberField.val(caseNumber) ;
		}
	}
}

</script>
